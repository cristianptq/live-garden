<style>
  :root{

  }

  header.top{padding:22px 4px 16px; border-bottom:2px solid var(--cerneala); margin-bottom:6px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  header.top .brand{display:flex; flex-direction:column; gap:2px;}
  header.top h1{font-size:1.5rem; margin:0; color:var(--frunza-deep);}
  header.top .tagline{font-size:0.82rem; color:#5a5142; max-width:320px;}
  header.top .top-right{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}

  .lang-switch{display:flex; border:1px solid var(--cerneala); border-radius:100px; overflow:hidden;}
  .lang-switch button{background:none; border:none; font-size:0.72rem; font-weight:700; padding:5px 12px; cursor:pointer; color:var(--cerneala); font-family:'Work Sans';}
  .lang-switch button.active{background:var(--cerneala); color:#fff;}

  nav.tabs{display:flex; gap:2px; flex-wrap:wrap; margin:16px 0 24px; border-bottom:1px solid #cfc6ae; overflow-x:auto;}
  nav.tabs button{font-family:'Work Sans', sans-serif; font-size:0.82rem; font-weight:600; background:none; border:none; cursor:pointer;
    padding:9px 12px 11px; color:#6b6250; border-bottom:3px solid transparent; transition:color .15s, border-color .15s; white-space:nowrap;}
  nav.tabs button:hover{color:var(--cerneala);}
  nav.tabs button.active{color:var(--frunza-deep); border-bottom-color:var(--paie-deep);}

  section.panel{display:none;}
  section.panel.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .card{background:var(--hartie-2); border:1px solid #d3c9ac; border-radius:var(--radius); padding:20px 20px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-weight:600; font-size:0.9rem; margin-bottom:6px;}
  .field .hint{font-size:0.78rem; color:#6b6250; margin-top:4px;}
  select, input[type=text], input[type=number]{width:100%; padding:9px 10px; font-size:0.95rem; border:1px solid #b9ae8d;
    border-radius:var(--radius); background:#fffdf7; color:var(--cerneala); font-family:inherit;}
  .radio-row, .check-row{display:flex; flex-direction:column; gap:8px;}
  .radio-row label, .check-row label{display:flex; align-items:flex-start; gap:8px; font-weight:400; cursor:pointer;

  .radio-row label:has(input:checked), .check-row label:has(input:checked){border-color:var(--frunza); background:#eef2e6;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}

  button.ghost{background:none; border:1px solid #b9ae8d; color:var(--cerneala); font-weight:600; font-size:0.8rem;

  .geo-msg{font-size:0.78rem; color:#5a5142;}

  en:['January','February','March','April','May','June','July','August','September','October','November','December']

function isoWeekDate(week, year){
  const simple = new Date(Date.UTC(year,0,1+(week-1)*7));
  const dow = simple.getUTCDay() || 7;
  simple.setUTCDate(simple.getUTCDate() + (1-dow));
  return simple;
}
function resolveWeek(weekNum){
  let year = 2026, w = weekNum;
  while(w<1){w+=52; year-=1;}
  while(w>52){w-=52; year+=1;}
  return isoWeekDate(w, year);
}
function weekInfo(weekNum){
  const d = resolveWeek(weekNum);
  const month = d.getUTCMonth();
  const weekOfMonth = Math.ceil(d.getUTCDate()/7);
  return {month, weekOfMonth, monthName: LUNI[LANG][month]};
}
function rangeLabel(a,b){
  const wa = weekInfo(a), wb = weekInfo(b);
  const wLabel = LANG==='en' ? 'wk' : 'săpt.';
  if(wa.month === wb.month){
    return wa.weekOfMonth===wb.weekOfMonth ? `${wa.monthName}, ${wLabel} ${wa.weekOfMonth}` : `${wa.monthName}, ${wLabel} ${wa.weekOfMonth}\u2013${wb.weekOfMonth}`;
  }
  return `${wa.monthName} (${wLabel}${wa.weekOfMonth}) \u2013 ${wb.monthName} (${wLabel}${wb.weekOfMonth})`;
}
function monthsTouched(a,b){
  const months = new Set();
  for(let w=a; w<=b; w++){ months.add(weekInfo(w).month); }
  if(months.size===0) months.add(weekInfo(a).month);
  return [...months];
}

/* =========================================================
   ROMANIA COUNTY → ZONE HEURISTIC (for geolocation)
   ========================================================= */
function normCounty(s){
  if(!s) return '';
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/judetul|county|comitatul/g,'').replace(/[-\s]+/g,'').trim();
}
const CALDA_COUNTIES = ['dolj','olt','teleorman','giurgiu','calarasi','ialomita','constanta','tulcea','mehedinti','timis','arad','braila','galati'].map(normCounty);
const RECE_COUNTIES = ['suceava','harghita','covasna','maramures','bistritanasaud','neamt','vrancea','hunedoara','alba','brasov','mures','valcea'].map(normCounty);

function zoneFromCounty(countyRaw){
  const c = normCounty(countyRaw);
  if(CALDA_COUNTIES.includes(c)) return 'calda';
  if(RECE_COUNTIES.includes(c)) return 'rece';
  return 'temperata';
}
function zoneFromLatitudeFallback(lat){
  if(lat < 45) return 'calda';
  if(lat > 47.3) return 'rece';
  return 'temperata';
}

function effectiveSF(){
  const z = ZONES[profile.zona];
  let S = z.S, F = z.F;
  if(profile.tunel){ S -= 3; F += 3; }
  return {S,F};
}

/* =========================================================
   BUILD MONTHLY OPERATIONS
   ========================================================= */
function buildMonthOps(){
  const {S,F} = effectiveSF();
  const months = {}; for(let i=0;i<12;i++) months[i]=[];

  CROPS.forEach(c=>{
    if(c.semanat_interior && profile.rasaduriAcasa){
      const a=S+c.semanat_interior.a, b=S+c.semanat_interior.b;
      monthsTouched(a,b).forEach(m=> months[m].push({crop:L(c,'nume'), action:'semanat_interior', label:t('lblSemanatInterior'), range:rangeLabel(a,b), note:L(c,'note')}));
    } else if(c.semanat_interior && !profile.rasaduriAcasa){
      const a=S+c.transplant.a, b=S+c.transplant.b;
      monthsTouched(a,b).forEach(m=> months[m].push({crop:L(c,'nume'), action:'transplant', label:t('lblCumparaRasad'), range:rangeLabel(a,b), note:L(c,'note')}));
    }
    if(c.transplant && profile.rasaduriAcasa){
      const a=S+c.transplant.a, b=S+c.transplant.b;
      monthsTouched(a,b).forEach(m=> months[m].push({crop:L(c,'nume'), action:'transplant', label:t('lblTransplantAfara'), range:rangeLabel(a,b), note:L(c,'note')}));
    }
    if(c.semanat_direct){
      c.semanat_direct.forEach(rangeDef=>{
        const base = rangeDef.relTo==='S'?S:F;
        const a=base+rangeDef.a, b=base+rangeDef.b;
        const succNote = c.succesiune ? (LANG==='en' ? ` Repeat every ~${c.succesiune_saptamani} weeks for a continuous harvest.` : ` Repetă la fiecare ~${c.succesiune_saptamani} săpt. pentru recoltă continuă.`) : '';
        monthsTouched(a,b).forEach(m=> months[m].push({crop:L(c,'nume'), action:'semanat_direct', label:t('lblSemanatDirect'), range:rangeLabel(a,b), note:L(c,'note') + succNote}));
      });
    }
    let startRef = null;
    if(c.transplant) startRef = S + c.transplant.a;
    else if(c.semanat_direct) startRef = (c.semanat_direct[0].relTo==='S'?S:F) + c.semanat_direct[0].a;
    if(startRef!==null && c.id!=='usturoi'){
      const dMin=Math.round(c.recoltare_zile[0]/7), dMax=Math.round(c.recoltare_zile[1]/7);
      const a=startRef+dMin, b=startRef+dMax;
      monthsTouched(a,b).forEach(m=> months[m].push({crop:L(c,'nume'), action:'recoltare', label:t('lblRecoltare'), range:rangeLabel(a,b), note:''}));
    }
  });
  months[6].push({crop:L(CROPS.find(c=>c.id==='usturoi'),'nume'), action:'recoltare', label:t('lblRecoltare'), range: LANG==='en'?'July':'Iulie', note: LANG==='en' ? 'Harvest when a third of the foliage has dried out.' : 'Recoltează când o treime din foliaj s-a uscat.'});

  GENERAL_TASKS.forEach(task=> months[task.luna].push({crop: LANG==='en'?'Garden (general)':'Grădină (general)', action:'general', label: L(task,'text'), range:'', note:''}));

  if(profile.start==='zero'){
    const buildMonthsList = [7,8,9];
    const buildLabel = LANG==='en' ? 'Build the first no-dig bed (see the "Building the garden" tab)' : 'Construiește primul strat no-dig (vezi tab-ul „Construcția grădinii”)';
    buildMonthsList.forEach(m=> months[m].push({crop: LANG==='en'?'Setup':'Amenajare', action:'constructie', label:buildLabel, range:'', note:''}));
  }

  return months;
}

  const nav = document.getElementById('tabs');

  TABS.forEach(id=>{

            <label><input type="radio" name="start" value="zero" ${cur.start==='zero'?'checked':''}> ${t('optStartZero')}</label>
            <label><input type="radio" name="start" value="intretinere" ${cur.start==='intretinere'?'checked':''}> ${t('optStartIntretinere')}</label>
          </div>
        </div>
        <div class="field">
          <label>${t('lblSuprafata')}</label>
          <input type="number" id="f-suprafata" min="1" value="${cur.suprafata}">
          <div class="hint">${t('hintSuprafata')}</div>
        </div>
      </div>
      <div class="field">
        <label>${t('lblMetoda')}</label>
        <div class="check-row">
          <label><input type="checkbox" id="f-rasaduri" ${cur.rasaduriAcasa?'checked':''}> ${t('optRasaduri')}</label>
          <label><input type="checkbox" id="f-tunel" ${cur.tunel?'checked':''}> ${t('optTunel')}</label>
        </div>
        <div class="hint">${t('hintMetoda')}</div>
      </div>
      <button class="primary" id="saveProfil">${t('btnSave')}</button>
    </div>
    <div class="install-hint">📱 <strong>${t('installHeading')}</strong><br>${t('installText')}</div>
  `;
  const zonaSel = document.getElementById('f-zona');
  const updateExemplu = ()=> document.getElementById('zonaExemplu').textContent = t('hintZonaPrefix') + L(ZONES[zonaSel.value],'exemplu');
  zonaSel.onchange = updateExemplu; updateExemplu();

  renderGeoMsg();
  document.getElementById('detectBtn').onclick = doDetectLocation;

  document.getElementById('saveProfil').onclick = ()=>{
    const startVal = document.querySelector('input[name=start]:checked').value;
    const newP = {
      zona: zonaSel.value,
      start: startVal,
      suprafata: Math.max(1, parseInt(document.getElementById('f-suprafata').value)||30),
      rasaduriAcasa: document.getElementById('f-rasaduri').checked,
      tunel: document.getElementById('f-tunel').checked
    };
    saveProfile(newP);
    activeTab='calendar';
    renderAll();
  };
}

function renderGeoMsg(){
  const el = document.getElementById('geoMsg');
  if(!el) return;
  if(geoState.status==='idle'){ el.innerHTML=''; return; }
  if(geoState.status==='loading'){ el.innerHTML = `<div class="geo-msg">${t('detecting')}</div>`; return; }
  if(geoState.status==='error'){ el.innerHTML = `<div class="geo-msg err">${geoState.message}</div>`; return; }
  if(geoState.status==='done'){ el.innerHTML = `<div class="geo-msg">${geoState.message}</div>`; return; }
}

function doDetectLocation(){
  if(!navigator.geolocation){
    geoState = {status:'error', message:t('detectUnsupported')};
    renderGeoMsg();
    return;
  }
  geoState = {status:'loading'};
  renderGeoMsg();
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    try{
      const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&zoom=8&addressdetails=1`, {headers:{'Accept':'application/json'}});
      const data = await resp.json();
      const addr = data.address || {};
      const country_code = (addr.country_code||'').toLowerCase();
      const countyName = addr.county || addr.state || addr.city || '';
      let zone, locLabel;
      if(country_code === 'ro'){
        zone = zoneFromCounty(countyName);
        locLabel = countyName || data.display_name || `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
        geoState = {status:'done', message: t('detectSuccess') + locLabel + t('detectZoneSuffix') + L(ZONES[zone],'nume').split('—')[0].trim()};
      } else {
        zone = zoneFromLatitudeFallback(latitude);
        locLabel = data.display_name || `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
        geoState = {status:'done', message: t('detectNonRO') + ' (' + locLabel + ')'};
      }
      const sel = document.getElementById('f-zona');
      if(sel){ sel.value = zone; sel.dispatchEvent(new Event('change')); }
    }catch(err){
      geoState = {status:'error', message: t('detectDenied')};
    }
    renderGeoMsg();
  }, (err)=>{
    geoState = {status:'error', message:t('detectDenied')};
    renderGeoMsg();
  }, {timeout:10000});
}

function actionMeta(action){
  return {
    semanat_interior:{cls:'action-semanat_interior', tag:t('tagSemanatInterior')},
    semanat_direct:{cls:'action-semanat_direct', tag:t('tagSemanatDirect')},
    transplant:{cls:'action-transplant', tag:t('tagTransplant')},
    recoltare:{cls:'action-recoltare', tag:t('tagRecoltare')},
    general:{cls:'action-general', tag:t('tagGeneral')},
    constructie:{cls:'action-constructie', tag:t('tagConstructie')}
  }[action];
}

function renderCalendar(){
  const p = document.getElementById('panel-calendar');
  if(!profile){ p.innerHTML=`<p>${t('needProfil')}</p>`; return; }
  const months = buildMonthOps();
  const nowMonth = new Date().getMonth();
  p.innerHTML = `<h2>${t('calendarHeading')} — ${L(ZONES[profile.zona],'nume').split('—')[0].trim()}</h2>
   <p style="color:#4a4436;max-width:680px;">${t('calendarIntro')}</p>
   <div class="month-grid">
   ${LUNI[LANG].map((nume,idx)=>{
     const ops = months[idx].sort((a,b)=> (a.action==='general')-(b.action==='general'));
     return `<div class="month-card ${idx===nowMonth?'current':''}">
       <h3>${nume} ${idx===nowMonth?`<span class="now-flag">${t('nowFlag')}</span>`:''}</h3>
       <ul class="op-list">
       ${ops.length? ops.map(o=>{
         const meta = actionMeta(o.action);
         return `<li class="op ${meta.cls}"><span class="tag">${meta.tag}${o.range?` <span class="range">${o.range}</span>`:''}</span>${(o.action==='general'||o.action==='constructie')? o.label : `${o.crop} — ${o.label}`}</li>`;
       }).join('') : `<li class="empty-note">${t('emptyNote')}</li>`}
       </ul>
     </div>`;
   }).join('')}
   </div>`;
}

function renderSarcini(){
  const p = document.getElementById('panel-sarcini');
  if(!profile){ p.innerHTML=`<p>${t('needProfil')}</p>`; return; }
  const months = buildMonthOps();
  p.innerHTML = `<h2>${t('sarciniHeading')}</h2><p style="color:#4a4436;max-width:680px;">${t('sarciniIntro')}</p>`;
  LUNI[LANG].forEach((nume,idx)=>{
    const ops = months[idx];
    if(!ops.length) return;
    const wrap = document.createElement('div');
    wrap.className='task-month';
    wrap.innerHTML = `<h3>${nume}</h3>` + ops.map((o,i)=>{
      const key = `${idx}-${i}-${o.crop}-${o.label}`.replace(/\s+/g,'_');
      const checked = doneTasks[key]?'checked':'';
      const doneCls = doneTasks[key]?'done':'';
      const text = (o.action==='general'||o.action==='constructie') ? o.label : `${actionMeta(o.action).tag}: ${o.crop} — ${o.label}`;
      return `<div class="task-item ${doneCls}" data-key="${key}">
        <input type="checkbox" ${checked}>
        <label>${text}${o.range?`<span class="range">${o.range}</span>`:''}</label>
      </div>`;
    }).join('');
    p.appendChild(wrap);
  });
  p.querySelectorAll('.task-item input').forEach(inp=>{
    inp.onchange = (e)=>{
      const item = e.target.closest('.task-item');
      const key = item.dataset.key;
      doneTasks[key] = e.target.checked;
      item.classList.toggle('done', e.target.checked);
      saveTasks();
    };
  });
}

function renderGhid(){
  const p = document.getElementById('panel-ghid');
  const principii = [
    ['Nu răstoarnă niciodată solul', 'Never turn the soil over', 'Solul se lasă intact — viața din el (ciuperci, bacterii, râme) rămâne neafectată. În loc de săpat, se adaugă materie organică la suprafață.', 'The soil is left intact — the life within it (fungi, bacteria, worms) stays undisturbed. Instead of digging, organic matter is added on top.'],
    ['Mulci permanent, tot anul', 'Mulch permanently, all year', 'Solul nu trebuie să fie niciodată gol. Paiele, frunzele sau compostul acoperă solul, reduc udarea, țin buruienile la distanță și se transformă în hrană pentru sol.', 'The soil should never be left bare. Straw, leaves or compost cover it, cut down on watering, keep weeds away, and turn into food for the soil.'],
    ['Compost aplicat la suprafață', 'Compost applied on top', 'În fiecare an se adaugă un strat de 2-5cm de compost peste stratul existent, fără a-l încorpora în sol.', 'Each year a 2-5cm layer of compost is added on top of the existing bed, without mixing it into the soil.'],
    ['Alei fixe, straturi neatinse', 'Fixed paths, undisturbed beds', 'Nu se calcă niciodată pe straturile de cultură — doar pe alei dedicate. Așa solul rămâne afânat natural, fără tasare.', 'You never step on the growing beds — only on dedicated paths. This way the soil stays naturally loose, without compaction.'],
    ['Rotația culturilor pe familii', 'Rotate crops by family', 'Nu se plantează aceeași familie (ex: solanacee) pe același strat 2 ani la rând — reduce bolile și epuizarea selectivă a nutrienților.', 'Don\'t plant the same family (e.g. nightshades) in the same bed two years running — it cuts disease pressure and selective nutrient depletion.'],
    ['Cover crops toamna', 'Cover crops in autumn', 'Straturile eliberate toamna se însămânțează cu o cultură de acoperire (secară, măzăriche) care protejează solul iarna și se retează primăvara ca mulci verde.', 'Beds freed up in autumn are sown with a cover crop (rye, vetch) that protects the soil over winter and is cut down in spring as green mulch.']

  p.innerHTML = `<h2>${t('ghidHeading')}</h2>` +
